[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-pr-review-agent"
version = "0.1.0"
description = "A selective, grounded, failure-aware AI pull-request review agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dheeraj Pranav" }]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# LLM extra: Groq (OpenAI-compatible, free tier). Kept out of the baseline/test path.
llm = ["groq>=0.11"]
# Server extra: the FastAPI ingress + GitHub client (production path).
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Data extra: the Tiger Cloud / Postgres data spine (production path).
data = ["asyncpg>=0.29", "sqlalchemy>=2.0"]
# Queue extra: Redis + ARQ (production async workers).
queue = ["arq>=0.25", "redis>=5.0"]
dev = ["pytest>=7.4", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
grounded = "grounded.cli:main"

[tool.setuptools.packages.find]
include = ["grounded*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
